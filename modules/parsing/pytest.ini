[pytest]
# Only collect the maintained suite. Model inference in the docling_* modules is not
# unit-tested, but the plumbing around it (request-path allowlists, body-size cap, batch
# abandon) is — see test_docling_runtime.py, which skips itself when `docling` is absent so
# the rest of the suite still runs without the heavy dependency installed.
testpaths = src/test/python
