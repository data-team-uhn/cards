# Run the Docling processing daemon on its own.
#
# No volumes are mounted on purpose: POST /parse takes the document in the request body and
# returns the Markdown and chunk tree in the response, so nothing needs to be shared with the
# caller. That is the whole point of the endpoint.
#
# On the JVM side, point IAP at it:
#   -Diap.docling.daemon.url=http://docling:18765
#   -Diap.docling.daemon.autostart=true   # also launch a local daemon
#   -Diap.docling.parse.combined=true

services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile
    image: iap/docling:latest
    # Worker sizing reads the container's cgroup quota, not the host's CPU and RAM, so these
    # limits are what the daemon budgets against. Allow roughly 2 GB per PDF worker.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    # Model weights are baked into the image, so no warm-up download is needed; the long
    # start_period covers loading them into the worker processes.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
