name: Selective Reactor Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Detect changed reactor modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          if [ -z "$CHANGED_FILES" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If root Maven config changed -> full build (safer)
          if echo "$CHANGED_FILES" | grep -qE '^(pom\.xml)'; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find nearest parent directories that contain a pom.xml (module roots)
          find_module_root() {
            local p="$1"
            local dir
            dir="$(dirname "$p")"
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              if [ -f "$dir/pom.xml" ]; then
                echo "$dir"
                return 0
              fi
              dir="$(dirname "$dir")"
            done
            return 1
          }

          MODULES=""
          while IFS= read -r f; do
            # Skip generated dirs
            if echo "$f" | grep -qE '(^|/)(target|node_modules|dist|build)/'; then
              continue
            fi
            m="$(find_module_root "$f" || true)"
            if [ -n "${m:-}" ]; then
              MODULES="$MODULES"$'\n'"$m"
            fi
          done <<< "$CHANGED_FILES"

          MODULES="$(echo "$MODULES" | sed '/^$/d' | sort -u || true)"

          if [ -z "$MODULES" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Touched module roots:"
          echo "$MODULES"

          # Comma-separated list for -pl
          echo "mode=modules" >> "$GITHUB_OUTPUT"
          echo "modules=$(echo "$MODULES" | paste -sd ',')" >> "$GITHUB_OUTPUT"

      - name: Full reactor build
        if: steps.detect.outputs.mode == 'full'
        run: mvn -B -ntp clean install -Ptests

      - name: Build only touched modules (+ dependencies)
        if: steps.detect.outputs.mode == 'modules'
        run: mvn -B -ntp -pl "${{ steps.detect.outputs.modules }}" -am clean install -Ptests

      - name: Nothing to build
        if: steps.detect.outputs.mode == 'none'
        run: echo "No reactor module changes detected; skipping."

