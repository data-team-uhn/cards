name: Pull Request Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also verify the actual merge results: two individually green PRs can still
  # conflict semantically once combined on the main branch
  push:
    branches: [main]

# Newer commits on the same PR supersede the running build; main builds are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache yarn packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: yarn-${{ hashFiles('aggregated-frontend/src/main/frontend/yarn.lock') }}
          restore-keys: yarn-

      # Production mode for the frontend, so that minification/tree-shaking
      # breakages surface here instead of at deployment time
      - name: Full build
        run: mvn -B -ntp clean install javadoc:javadoc -Ptests -DwebpackArguments=--mode=production

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
